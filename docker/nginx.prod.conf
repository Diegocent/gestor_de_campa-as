server {
  listen 80;
  server_name _;

  # SPA
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Media subida por agentes (imágenes, docs, etc.)
  location /media/ {
    proxy_pass http://server:4000/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 20m;
  }

  # API (backend Fastify)
  # En producción el frontend hace fetch a /api${path}; el backend NO usa /api
  # como prefijo, por eso removemos /api en el proxy.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
  }

  # Socket.IO (websocket)
  location /socket.io/ {
    proxy_pass http://server:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}

